replicaCount: 1

image:
  repository: ghcr.io/intutic/turing
  pullPolicy: IfNotPresent
  tag: "v0.3.5-cuda"







service:
  type: ClusterIP
  port: 8000

model:
  name: "llama-3.1-70b"
  device: "cuda"
  maxBatchSize: 64

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 32Gi
    cpu: "8"
  requests:
    nvidia.com/gpu: 1
    memory: 24Gi
    cpu: "4"

prometheus:
  enabled: true
  path: "/metrics"
  port: 8000

llmd:
  enabled: false
  guide: "optimized-baseline"
  role: "prefill-decode"     # prefill | decode | prefill-decode
  engineType: "turing"       # engine type label for EPP discovery
  kvEvents:
    enabled: true
    pubPort: 5556
    replayPort: 5559
    blockSize: 64
