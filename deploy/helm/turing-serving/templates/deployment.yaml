apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-turing
  labels:
    app: turing-serving
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: turing-serving
  template:
    metadata:
      labels:
        app: turing-serving
    spec:
      containers:
        - name: turing-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-m", "turing.cli", "serve"]
          args:
            - "--model"
            - "{{ .Values.model.name }}"
            - "--device"
            - "{{ .Values.model.device }}"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
