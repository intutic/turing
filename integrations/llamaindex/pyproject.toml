[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.mypy]
disallow_untyped_defs = true
exclude = ["_static", "build", "examples", "notebooks", "venv"]
ignore_missing_imports = true
python_version = "3.9"

[tool.poetry]
authors = ["Ishan Gupta <support@intutic.ai>"]
description = "LlamaIndex LLM integration for Turing Engine"
exclude = ["**/BUILD"]
keywords = ["llm", "turing", "inference", "subspace", "kv-cache", "rag"]
license = "MIT"
maintainers = ["Ishan Gupta <support@intutic.ai>"]
name = "llama-index-llms-turing"
packages = [{include = "llama_index/"}]
readme = "README.md"
version = "0.3.0"



[tool.poetry.dependencies]
python = ">=3.9,<4.0"
llama-index-core = "^0.10.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.3.0"
