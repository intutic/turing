apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: turing-runtime
  namespace: default
  labels:
    llm-d.ai/engine-type: "turing"
spec:
  supportedModelFormats:
    - name: turing-subspace
      version: "1"
      autoSelect: true
    - name: huggingface
      version: "1"
      autoSelect: false
  containers:
    - name: kserve-container
      image: ghcr.io/intutic/turing:v0.3.1-cuda
      command: ["python3", "-m", "turing.cli", "serve"]



      args:
        - "--model"
        - "$(MODEL_NAME)"
        - "--port"
        - "8080"
        - "--device"
        - "cuda"
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 5556
          name: zmq-pub
          protocol: TCP
        - containerPort: 5559
          name: zmq-replay
          protocol: TCP
      env:
        - name: MODEL_NAME
          value: "llama-3.1-70b"
        - name: PYTHONHASHSEED
          value: "0"
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: "32Gi"
          cpu: "8"
        requests:
          nvidia.com/gpu: "1"
          memory: "24Gi"
          cpu: "4"
