# KServe ServingRuntime for Turing Engine: `turing serve` (OpenAI-compatible /v1 API) on port 8080.
# KServe's storage initializer downloads the InferenceService's storageUri (hf://, s3://, gs://, pvc://) to
# /mnt/models, and Turing loads the Hugging Face checkpoint from there.
# Image: the published CUDA image (ghcr.io/intutic/turing:<version>-cuda), built from deploy/Dockerfile.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: turing-runtime
  annotations:
    prometheus.kserve.io/port: "8080"
    prometheus.kserve.io/path: /metrics
spec:
  supportedModelFormats:
    - name: huggingface
      version: "1"
      autoSelect: false  # opt in with `runtime: turing-runtime`; KServe's own Hugging Face runtime keeps the default
  containers:
    - name: kserve-container
      image: ghcr.io/intutic/turing:v2.0.0-cuda
      command: ["turing", "serve"]
      args: ["--model", "/mnt/models", "--host", "0.0.0.0", "--port", "8080", "--device", "cuda"]
      ports:
        - containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 5
        failureThreshold: 120  # loading the weights can take minutes
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          memory: 24Gi
          nvidia.com/gpu: "1"
