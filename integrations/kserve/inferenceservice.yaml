# An InferenceService on turing-runtime (serving_runtime.yaml). hf:// storage URIs need KServe 0.15 or later;
# s3://, gs:// and pvc:// work on earlier versions.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-1-5b-instruct
spec:
  predictor:
    model:
      modelFormat:
        name: huggingface
      runtime: turing-runtime
      storageUri: hf://Qwen/Qwen2.5-1.5B-Instruct
