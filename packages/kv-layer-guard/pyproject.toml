[build-system]
requires = ["setuptools>=77"]  # SPDX license string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "kv-layer-guard"
version = "0.1.0"
description = "Find the attention layers a low-bit KV cache breaks, before serving with it (vLLM kv_cache_dtype_skip_layers)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "transformers>=4.56"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["kv_layer_guard"]
