name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
        include:
          # NEON build and full suite on Linux arm64
          - os: ubuntu-24.04-arm
            python-version: '3.12'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build tools & compiler (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake liburing-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pybind11
          pip install --no-build-isolation -e ".[dev]"
          pip install -e packages/langchain-turing  # tests/test_langchain_integration.py (it ran on langchain-core before the package split)

      - name: Build C++20 AVX2 SIMD Extension
        run: |
          python setup.py build_ext --inplace

      - name: Build standalone turing-cli (CMake)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake
          ./build-cmake/bin/turing-cli info

      # Three Windows runs crashed with an illegal instruction (0xc000001d) in PyTorch's bf16 CPU matmul, each in
      # test_key_smoothing_is_exact_and_tames_outlier_channels_in_a_4bit_cache, and their reruns passed (2026-11-26).
      # The one with this line logged ran on an Intel Family 6 Model 207 (Emerald Rapids, AVX512); every passing
      # Windows job ran on AMD. Likely oneDNN's AMX bf16 kernels on a VM whose OS does not run AMX tiles.
      - name: Runner CPU
        run: python -c "import platform, torch; print(platform.processor() or platform.machine(), '|', torch.backends.cpu.get_cpu_capability(), '| AMX tiles:', torch.cpu._is_amx_tile_supported())"

      - name: Run Test Suite (Strict Warning Escalation)
        env:
          ONEDNN_MAX_CPU_ISA: AVX512_CORE_BF16  # AVX-512 with bf16, no AMX: see the step above
        run: |
          pytest -v

  # AVX2 build on Intel macOS. Build-only: PyTorch publishes no macOS x86_64 wheels past 2.2, older than the
  # suite needs. (macos-13, the previous Intel image, is retired; macos-15-intel is its replacement.)
  native-build-intel-mac:
    name: Native build (macos-15-intel, AVX2)
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build extension and turing-cli
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11 numpy
          python setup.py build_ext --inplace
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake

      - name: Check the AVX2 path was compiled in
        run: |
          ./build-cmake/bin/turing-cli info | grep "SIMD backend: avx2"
          python - <<'PY'
          import glob, importlib.util
          spec = importlib.util.spec_from_file_location("turing_csrc", glob.glob("turing/turing_csrc*.so")[0])
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.simd_backend() == "avx2", m.simd_backend()
          print("extension SIMD backend:", m.simd_backend())
          PY
