[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-engine"
version = "1.7.0"

description = "Turing Engine: Subspace-Compressed High-Performance LLM Inference & Serving Runtime for 70B+ LLMs on single consumer GPUs"




authors = [
    {name = "Ishan Gupta", email = "support@intutic.ai"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pybind11>=2.10.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "transformers>=4.38.0",
    "jinja2>=3.1.0",  # transformers' apply_chat_template (chat endpoints) refuses older versions
    "huggingface-hub>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "wheel",
    "build",
    "pyzmq>=24.0.0",
    "msgpack>=1.0",  # llm-d KV events (tests/test_kv_events.py)
    "prometheus-client>=0.17",  # tests parse /metrics with its exposition-format parser
    "httpx2>=2.0; python_version >= '3.10'",  # starlette >= 1.x's TestClient warns (an error under -W error) without it
    "langchain-core>=0.3",  # tests/test_langchain_integration.py
    "gguf>=0.19.0",  # ggml's own Python package: the reference the GGUF dequantization and loader tests compare against
    "datasets>=2.18",  # WikiText-2 / GSM8K for calibration (turing convert, GPTQ), quality scripts and evals
    "llguidance>=1.9.0",  # tests/test_generation_api.py: constrained decoding (the structured extra)
    "jsonschema>=4.0",
]
structured = [  # token-level JSON-schema / tool-call constrained decoding (response_format, Ollama format, constrain())
    "llguidance>=1.9.0",
    "jsonschema>=4.0",
]
llmd = [
    "pyzmq>=24.0.0",
    "msgpack>=1.0",
]


[project.scripts]
turing = "turing.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:urllib3.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:datetime.*",
    "ignore::DeprecationWarning:importlib.*",
    "ignore::UserWarning:torch.*",
    "ignore::UserWarning:urllib3.*",
    "ignore:.*unauthenticated requests.*:UserWarning",
    "ignore:.*torch_dtype.*:UserWarning",
    "ignore:.*SwigPy.*:DeprecationWarning",
    "ignore:.*swigvarlink.*:DeprecationWarning",
    "ignore:.*builtin type.*:DeprecationWarning",
    "ignore:.*datetime.datetime.utcnow.*:DeprecationWarning",
    "ignore::DeprecationWarning:huggingface_hub.*",
    "ignore:.*hf_xet.*:DeprecationWarning",
    "ignore:.*download_files.*:DeprecationWarning",
    "ignore:.*CUDA initialization.*:UserWarning",
    "ignore:.*NVIDIA driver.*:UserWarning",
    "ignore:.*Torch was not compiled with CUDA enabled.*:UserWarning",
    "ignore:.*Metal Performance Shaders.*:UserWarning",
    "ignore:.*not authenticated.*:UserWarning"
]
