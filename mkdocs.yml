site_name: Turing Engine
site_description: High-Performance Frontier LLM Serving Runtime for Sub-24GB Hardware
site_author: Ishan Gupta
site_url: https://intutic.github.io/turing/
repo_url: https://github.com/intutic/turing
repo_name: intutic/turing

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Models & Hardware: models_and_hardware.md
  - Serving & API: serving.md
  - Architecture: architecture.md
  - Kubernetes & llm-d: llmd-integration.md
  - Integrations: integrations.md
  - Benchmarks: benchmarks.md
  - Licensing: licensing.md

